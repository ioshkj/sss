print-progress: true

concurrent: 50
media-concurrent: 20
speed-concurrent: 10
shuffle-test-order: true

check-interval: 1440
success-limit: 0

timeout: 5000
alive-test-url: http://gstatic.com/generate_204
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
min-speed: 280
download-timeout: 10
download-mb: 20

listen-port: ":8199"
rename-node: false
node-prefix: ""

media-check: false
keep-days: 0
output-dir: "/app/output"
enable-web-ui: false
api-key: ""
save-method: local

ipv6: false
dns:
  enable: false

sub-urls-concurrent: 5
sub-urls-retry: 1
sub-urls:
  - "http://127.0.0.1:8899/nodes.txt"
